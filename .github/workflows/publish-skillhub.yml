name: Publish SkillHub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish
        required: true
        type: string

jobs:
  publish-skillhub:
    name: Publish skill to SkillHub
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout publisher
        uses: actions/checkout@v4

      - name: Select release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag" >&2
            exit 1
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"

      - name: Checkout skill release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Prepare SkillHub distribution
        run: |
          python -m pip install PyYAML==6.0.3
          python .github/scripts/prepare_skillhub.py \
            --source release \
            --destination "${RUNNER_TEMP}/skillhub-publish" \
            --tag "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Install SkillHub CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/skillhub" --version

      - name: Authenticate SkillHub CLI
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SKILLHUB_TOKEN}" ]; then
            echo "Missing required secret SKILLHUB_TOKEN" >&2
            exit 1
          fi
          skillhub auth login \
            --token "${SKILLHUB_TOKEN}" \
            --host https://api.skillhub.cn
          skillhub auth whoami

      - name: Publish to SkillHub
        shell: bash
        run: |
          set -euo pipefail
          staging_dir="${RUNNER_TEMP}/skillhub-publish"
          skillhub publish "$staging_dir" --dry-run
          set +e
          output="$(skillhub publish "$staging_dir" --changelog "Release ${SKILL_SLUG} v${SKILL_VERSION}" 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s\n' "$output" | grep -Eq "版本 ${SKILL_VERSION} 已存在|already exists"; then
              echo "SkillHub version ${SKILL_VERSION} already exists; treating tag replay as successful."
              exit 0
            fi
            exit "$status"
          fi
