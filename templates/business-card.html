<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电子名片模板 · ShareOne</title>
<meta name="description" content="ShareOne 电子名片模板：一份 HTML 同时产出微信可发的图片、可扫的链接和 90x54mm 印刷 PDF。">
<!-- A personal card is meant to be handed out, not found by searching a name. -->
<meta name="robots" content="noindex, nofollow">
<style>
/* ===========================================================================
   Card geometry is declared once, in millimetres, and every inside measurement
   is a `cqw` — 1cqw = 1% of the card's own width. The same stylesheet therefore
   renders a pixel-accurate 90x54mm print page and a phone-width preview with no
   second set of numbers to keep in sync.
   =========================================================================== */
:root {
  --card-w: 90mm;
  --card-h: 54mm;
  --paper: #FBFBF9;
  --ink: #1A1A18;
  --ink-soft: #6E6E6A;
  --ink-faint: #9C9C97;
  --dark: #1A1A18;
  --on-dark: #EDEDE9;
  --on-dark-soft: rgba(237, 237, 233, .55);
  --page: #F4F4F1;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC",
          "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #121211; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: clamp(20px, 6vw, 56px) 16px calc(40px + env(safe-area-inset-bottom, 0px));
  background: var(--page);
  font-family: var(--sans);
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: clamp(18px, 4vw, 26px);
}

/* --- the two card faces ------------------------------------------------- */
.deck { display: flex; flex-direction: column; gap: clamp(14px, 3.5vw, 22px); width: 100%; max-width: 420px; }

.card {
  container-type: inline-size;
  position: relative;
  width: 100%;
  aspect-ratio: 90 / 54;
  overflow: hidden;
  border-radius: 1.6cqw;
  /* A printed card is a physical object — it keeps its own colours whatever
     theme the viewer's phone is in. Only the page around it follows the theme. */
  color-scheme: light;
  box-shadow: 0 1px 2px rgba(0,0,0,.10), 0 10px 30px -12px rgba(0,0,0,.30);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
.card__inner { position: absolute; inset: 0; padding: 7.2cqw 7.6cqw; display: flex; flex-direction: column; }

/* front ------------------------------------------------------------------ */
.front { background: var(--paper); color: var(--ink); }
/* The mark again, oversized and cropped by the corner — the brand geometry as
   a watermark. Kept well clear of the name so it never fights the type. */
.front__motif {
  position: absolute;
  right: -9cqw;
  bottom: -13cqw;
  height: 50cqw;
  opacity: .04;
  pointer-events: none;
}
.lockup { display: flex; align-items: center; gap: 3.4cqw; }
.lockup__mark { height: 10cqw; display: block; }
/* Swap this text span for an <svg> of your own wordmark when you have one. */
.lockup__word { font-size: 4.3cqw; font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
.front__id { margin-top: auto; position: relative; }
.front__name {
  font-size: 10.2cqw;
  font-weight: 500;
  letter-spacing: .04em;
  line-height: 1;
  margin: 0;
}
.front__rule { width: 9.5cqw; height: .32cqw; background: var(--ink); margin: 3.4cqw 0 3cqw; opacity: .85; }
.front__title { font-size: 3.5cqw; letter-spacing: .28em; color: var(--ink-soft); }

/* back ------------------------------------------------------------------- */
.back { background: var(--dark); color: var(--on-dark); }
.back .card__inner { flex-direction: row; gap: 4cqw; }
.back__left { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; }
.back__head { display: flex; align-items: center; gap: 2.8cqw; }
.back__mark { height: 7cqw; width: auto; display: block; opacity: .95; }
.back__org { font-size: 2.9cqw; letter-spacing: .06em; color: var(--on-dark); opacity: .88; }
.contact { margin-top: auto; display: flex; flex-direction: column; gap: 2.5cqw; }
.contact__row { display: flex; align-items: flex-start; gap: 2.6cqw; font-size: 3.05cqw; line-height: 1.35; }
.contact__icon { width: 3.3cqw; height: 3.3cqw; flex: none; margin-top: .35cqw; opacity: .58; }
.contact__val { min-width: 0; word-break: break-word; }

.back__right { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
.chip { background: #fff; border-radius: 1.4cqw; padding: 1.1cqw; display: block; }
.chip svg { display: block; width: 21cqw; height: 21cqw; }
.back__scan { margin-top: 1.9cqw; font-size: 2.35cqw; letter-spacing: .18em; color: var(--on-dark-soft); }

/* --- the page around the cards (screen only) ----------------------------- */
/* The card faces are an image — at phone width their type is ~11px. These rows
   repeat the same values as real, selectable, tappable text at a readable size,
   and the script fills them from the card face so nothing is typed twice. */
.actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; }
.btn {
  display: flex; align-items: center; gap: 12px;
  min-height: 54px; padding: 0 18px;
  border: 1px solid rgba(26,26,24,.14); border-radius: 12px;
  background: #fff; color: var(--ink);
  font-size: 15.5px; font-family: inherit; text-decoration: none;
  transition: transform .12s ease;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; flex: none; opacity: .5; }
.btn__val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn--primary {
  justify-content: center;
  background: var(--ink); color: #fff; border-color: var(--ink);
  font-size: 16px; font-weight: 500;
  margin-bottom: 4px;
}
.btn--primary svg { opacity: .85; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn { background: #1E1E1C; color: #EDEDE9; border-color: rgba(237,237,233,.16); }
  :root:not([data-theme="light"]) .btn--primary { background: #EDEDE9; color: #1A1A18; }
}
.note { max-width: 420px; font-size: 12.5px; line-height: 1.6; color: var(--ink-faint); text-align: center; margin: 0; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .note { color: #76766F; }
}

/* --- print: the cards alone, at exact trim size -------------------------- */
@page { size: 90mm 54mm; margin: 0; }
@media print {
  body { padding: 0; background: #fff; display: block; gap: 0; }
  .actions, .note { display: none !important; }
  .deck { display: block; max-width: none; gap: 0; }
  .card {
    width: var(--card-w); height: var(--card-h);
    aspect-ratio: auto; border-radius: 0; box-shadow: none;
    break-after: page; page-break-after: always;
  }
  .card:last-child { break-after: auto; page-break-after: auto; }
}
</style>
</head>
<body>
<!--
  ============================================================================
  ShareOne 电子名片模板 — 一份 HTML，三种交付

    1. 手机/微信可发的图片   page_screenshot 这一页
    2. 可扫的电子名片链接    publish.js 发布本文件
    3. 可印的 90x54mm PDF    Chrome 打印 / Page.printToPDF（已内置 @page）

  改名片只要改下面 data-field="..." 的文字。vCard、tel:、mailto: 和四个操作
  按钮都由脚本从卡面读取，不要在别处重复写一遍联系方式。

  三处需要替换：
    A) data-field 的文字（姓名/职务/公司/电话/邮箱/地址/网址）
       - data-surname 是姓氏的字数，vCard 靠它切分姓和名（中文名没有空格）
    B) LOGO —— 三处 <svg> 里的占位立方体换成你的标记。
       .ai 文件其实是 PDF，可以直接抽成矢量：
         python -c "import fitz;print(fitz.open('logo.ai')[0].get_svg_image())"
    C) 二维码 —— 必须重新生成，指向这张名片发布后的链接：
         node ../scripts/make_qr.js --text "https://s.shareone.vip/s/你的slug" \
              --ecc Q --format path
       把输出贴进 class="chip" 里那个 <path> 的 d 属性。
       先用 --slug 想好链接再生成二维码，顺序反了二维码会指向不存在的页面。

  二维码为什么指向名片链接而不是官网：扫码的人当场想要的是把你存进通讯录，
  名片页能一键存 vCard，官网不能；而且印出去的卡改不了，名片页可以随时更新。
  ============================================================================
-->

<script>
// Every value is READ BACK OUT of the card face, which is the only place it is
// written. The vCard, the tel: link and the mailto: link therefore cannot drift
// from what is printed on the card — edit the markup above and all four follow.
(function () {
  function field(name) {
    var el = document.querySelector('[data-field="' + name + '"]');
    return el ? el.textContent.trim() : '';
  }

  var name = field('name');
  var tel = field('tel');
  var email = field('email');
  var url = /^https?:\/\//.test(field('url')) ? field('url') : 'https://' + field('url');
  var surnameLength = Number(document.querySelector('[data-field="name"]').dataset.surname || 1);

  var vcf = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    // Chinese names are written family-name-first and carry no separator, so the
    // split point is declared on the element rather than guessed from a space.
    'N:' + name.slice(0, surnameLength) + ';' + name.slice(surnameLength) + ';;;',
    'FN:' + name,
    'ORG:' + field('org'),
    'TITLE:' + field('title'),
    'TEL;TYPE=CELL,VOICE:' + tel,
    'EMAIL;TYPE=INTERNET,WORK:' + email,
    'ADR;TYPE=WORK:;;' + field('address') + ';;;;',
    'URL:' + url,
    'END:VCARD',
  ].join('\r\n') + '\r\n';

  var dl = document.getElementById('vcf');
  // A UTF-8 data: URI keeps the download working inside ShareOne's origin-opaque
  // iframe, where a Blob URL would count as cross-origin.
  dl.href = 'data:text/vcard;charset=utf-8,' + encodeURIComponent(vcf);
  dl.setAttribute('download', name + '-' + field('org') + '.vcf');

  function wire(id, href, label) {
    var el = document.getElementById(id);
    el.href = href;
    el.querySelector('.btn__val').textContent = label;
  }
  wire('act-tel', 'tel:' + tel.replace(/[^+\d]/g, ''), tel);
  wire('act-mail', 'mailto:' + email, email);
  wire('act-web', url, field('url'));
})();
</script>
